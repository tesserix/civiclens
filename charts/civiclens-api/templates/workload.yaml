apiVersion: v1
kind: ServiceAccount
metadata:
  name: civiclens-api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: civiclens-api
  annotations: {argocd.argoproj.io/sync-wave: "3"}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: civiclens-api }
  template:
    metadata:
      labels: { app: civiclens-api }
    spec:
      serviceAccountName: civiclens-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: civiclens-api }
      containers:
        - name: api
          image: "{{ .Values.image.repository }}@{{ required "Set an actual published API image digest" .Values.image.digest }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports: [{ name: http, containerPort: 8080 }]
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: PGSSLROOTCERT
              value: /var/run/civiclens/database-ca/ca.crt
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 20
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /var/run/civiclens/secrets
              readOnly: true
            - name: database-ca
              mountPath: /var/run/civiclens/database-ca
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.secretName }}
            defaultMode: 0440
        - name: database-ca
          secret:
            secretName: {{ .Values.databaseCaSecret }}
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: civiclens-api
spec:
  type: ClusterIP
  selector: { app: civiclens-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: civiclens-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: civiclens-api }
