# Append these entries to the corresponding lists in the owning global-postgres
# chart. Do not replace the existing lists or reconcile this file directly.
bootstrap:
  postInitSQL:
    - CREATE ROLE civiclens_migrator LOGIN
    - CREATE ROLE civiclens_runtime LOGIN
    - CREATE DATABASE civiclens_db OWNER civiclens_migrator
managedRoles:
  - name: civiclens_migrator
    passwordSecret: global-postgres-civiclens-migrator
    comment: CivicLens schema owner; migration jobs only
  - name: civiclens_runtime
    passwordSecret: global-postgres-civiclens-runtime
    comment: CivicLens runtime; explicit DML grants only
databases:
  - name: civiclens_db
    owner: civiclens_migrator
