apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: civiclens-api-config
  namespace: civiclens
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: civiclens-openbao
  target:
    name: civiclens-api-config
    template:
      engineVersion: v2
      data:
        secrets.json: |
          {
            "civiclens-database-url": {{ .databaseUrl | toJson }},
            "civiclens-identity-key": {{ .identityKey | toJson }}
          }
  data:
    - secretKey: databaseUrl
      remoteRef:
        key: civiclens/production/app/civiclens-database-url
        property: value
    - secretKey: identityKey
      remoteRef:
        key: civiclens/production/app/civiclens-identity-key
        property: value
