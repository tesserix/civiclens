services:
  postgres:
    image: postgres@sha256:a85daf0dbd5e79586e850e3fe4b21b796799828ad015ce2166aeb98cc24da61c
    environment:
      POSTGRES_USER: civiclens
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: civiclens
    ports: ["127.0.0.1:25439:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "civiclens"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes: ["civiclens-local:/var/lib/postgresql/data"]
volumes:
  civiclens-local:
