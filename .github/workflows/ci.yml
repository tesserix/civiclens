name: CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97 --profile minimal && rustup default 1.97
      - run: bash scripts/ci/check-rsa-dependency.sh
  quality:
    needs: dependency-policy
    uses: tesserix/tesserix-workflows/.github/workflows/ci.yml@62f7f663a98d5ef92567850dd03c8c2513c9068e
    with:
      rust_enabled: true
      rust_toolchain: "1.97"
      rust_database_enabled: true
      rust_database_setup_script: scripts/ci/database.sh
      rust_database_environment_prefix: CIVICLENS_TEST_
      rust_coverage_min_lines: 70
      expo_enabled: true
      expo_working_directory: .
      expo_install_directory: .
      expo_lockfile_path: package-lock.json
      expo_node_version: "24.14.0"
      expo_package_manager: npm
      expo_doctor_version: "1.20.4"
      expo_audit_config_path: .audit-ci.jsonc
      containers_enabled: true
      container_images: >-
        {"include":[{"name":"civiclens-api","context":".","dockerfile":"docker/api.Dockerfile","target":"","source_root":"api","build_args":"","requires_application_build_secret":false,"trivy_ignore_file":"","smoke_port":0,"smoke_path":"/healthz"}]}
  bundles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.14.0"
          cache: npm
      - run: npm ci
      - run: npm run export
      - run: node --test scripts/ci/*.test.mjs
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97 --profile minimal && rustup default 1.97
      - run: cargo test --locked export_mobile_contract
      - run: git diff --exit-code -- shared/generated.ts
